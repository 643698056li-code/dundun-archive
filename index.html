<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DUNDUN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"PingFang SC",
sans-serif;

background:#fbfbfd;

color:#1d1d1f;

overflow-x:hidden;
}

/* =========================
   HERO
========================= */

.hero{

max-width:1200px;

margin:auto;

padding-top:120px;

padding-left:30px;
padding-right:30px;

text-align:center;
}

.badge{

font-size:15px;

font-weight:600;

color:#86868b;

margin-bottom:25px;

letter-spacing:1px;
}

.hero h1{

font-size:
clamp(
60px,
10vw,
110px
);

font-weight:700;

line-height:1.05;

letter-spacing:-4px;

margin-bottom:25px;
}

.gradient{

background:
linear-gradient(
90deg,
#4f46e5,
#06b6d4,
#ec4899
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;
}

.subtitle{

max-width:700px;

margin:auto;

font-size:28px;

line-height:1.6;

color:#6e6e73;
}

.hero-image{

margin-top:80px;

width:100%;

max-width:1200px;

border-radius:30px;

box-shadow:
0 40px 80px rgba(0,0,0,.08);
}

/* =========================
   SECTION
========================= */

.section{

max-width:1400px;

margin:auto;

padding:
160px
30px;
}

.section-title{

font-size:56px;

font-weight:700;

letter-spacing:-2px;

margin-bottom:20px;

text-align:center;
}

.section-desc{

font-size:22px;

color:#6e6e73;

text-align:center;

max-width:700px;

margin:
0 auto 80px;
}

/* =========================
   STATS
========================= */

.stats{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(250px,1fr)
);

gap:30px;
}

.stat{

text-align:center;
}

.stat-number{

font-size:72px;

font-weight:700;

letter-spacing:-3px;
}

.stat-label{

font-size:20px;

color:#6e6e73;
}

/* =========================
   GALLERY
========================= */

.gallery{

column-count:3;

column-gap:30px;
}

.card{

break-inside:avoid;

margin-bottom:30px;

background:white;

border-radius:24px;

overflow:hidden;

box-shadow:
0 15px 50px rgba(0,0,0,.05);

transition:.35s;
}

.card:hover{

transform:
translateY(-8px);
}

.card img{

width:100%;

display:block;
}

.card-content{

padding:20px;
}

.card-content h3{

font-size:18px;

font-weight:600;
}

/* =========================
   TIMELINE
========================= */

.timeline{

max-width:900px;

margin:auto;
}

.timeline-item{

padding:40px;

margin-bottom:30px;

background:white;

border-radius:24px;

box-shadow:
0 15px 50px rgba(0,0,0,.05);
}

.timeline-date{

color:#0071e3;

font-size:15px;

font-weight:600;

margin-bottom:12px;
}

.timeline-item h3{

font-size:28px;

margin-bottom:10px;
}

.timeline-item p{

font-size:18px;

line-height:1.8;

color:#555;
}

/* =========================
   FOOTER
========================= */

.footer{

padding:120px 20px;

text-align:center;

color:#86868b;

font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

.gallery{
column-count:2;
}

.hero h1{
font-size:70px;
}

.section-title{
font-size:42px;
}

.subtitle{
font-size:22px;
}

}

@media(max-width:600px){

.gallery{
column-count:1;
}

.hero h1{
font-size:52px;
}

.subtitle{
font-size:20px;
}

.section-title{
font-size:36px;
}

}

</style>

</head>

<body>

<!-- HERO -->

<section class="hero">

<div class="badge">

DUNDUN DIGITAL MUSEUM

</div>

<h1>

腿虽短，

<br>

<span class="gradient">

故事很长。

</span>

</h1>

<p class="subtitle">

记录墩墩的成长轨迹、
冒险经历与鸡胸肉研究成果。

</p>

<img
class="hero-image"
src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=2000"
>

</section>

<!-- STATS -->

<section class="section">

<h2 class="section-title">

Archive Statistics

</h2>

<p class="section-desc">

一个持续成长中的数字档案馆

</p>

<div class="stats">

<div class="stat">

<div
id="photoCount"
class="stat-number">

0

</div>

<div class="stat-label">

Photos

</div>

</div>

<div class="stat">

<div
id="timelineCount"
class="stat-number">

0

</div>

<div class="stat-label">

Events

</div>

</div>

<div class="stat">

<div class="stat-number">

14

</div>

<div class="stat-label">

kg Hero Corgi

</div>

</div>

</div>

</section>

<!-- GALLERY -->

<section class="section">

<h2 class="section-title">

精选瞬间

</h2>

<p class="section-desc">

Every picture tells a story.

</p>

<div
id="gallery"
class="gallery">
</div>

</section>

<!-- TIMELINE -->

<section class="section">

<h2 class="section-title">

成长轨迹

</h2>

<p class="section-desc">

记录每一个值得纪念的时刻

</p>

<div
id="timeline"
class="timeline">
</div>

</section>

<div class="footer">

© DUNDUN DIGITAL MUSEUM

</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
