<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>DUNDUN ARCHIVE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

    background:#f5f5f7;
}

.hero{

    height:60vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:white;
}

.hero h1{

    font-size:4rem;

    margin-bottom:20px;
}

.hero p{

    color:#666;
}

.section-title{

    padding:40px 30px 20px;

    font-size:2rem;
}

.gallery{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(300px,1fr));

    gap:20px;

    padding:30px;
}

.card{

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.05);
}

.card img{

    width:100%;

    height:300px;

    object-fit:cover;
}

.card h3{

    padding:15px;
}

.timeline{

    padding:30px;
}

.timeline-item{

    background:white;

    border-radius:15px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.05);
}

.timeline-item h3{

    margin-bottom:10px;
}

.timeline-item .date{

    color:#888;

    margin-bottom:10px;
}

footer{

    text-align:center;

    padding:50px;

    color:#999;
}

</style>

</head>

<body>

<section class="hero">

<h1>DUNDUN ARCHIVE</h1>

<p>
A Digital Museum of Dundun
</p>

</section>

<h2 class="section-title">
📷 照片墙
</h2>

<div
id="gallery"
class="gallery">
</div>

<h2 class="section-title">
📖 成长时间轴
</h2>

<div
id="timeline"
class="timeline">
</div>

<footer>

DUNDUN ARCHIVE © 2026

</footer>

<script src="js/config.js"></script>

<script src="js/app.js"></script>

</body>

</html>
