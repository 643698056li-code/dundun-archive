<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DUNDUN DIGITAL MUSEUM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"PingFang SC",
sans-serif;

background:#fbfbfd;

color:#1d1d1f;

overflow-x:hidden;
}

/* ================= HERO ================= */

.hero{

max-width:1400px;

margin:auto;

padding-top:120px;

text-align:center;
}

.badge{

font-size:15px;

font-weight:600;

color:#86868b;

letter-spacing:1px;

margin-bottom:20px;
}

.hero h1{

font-size:
clamp(
56px,
10vw,
120px
);

line-height:1.05;

font-weight:700;

letter-spacing:-4px;

margin-bottom:20px;
}

.gradient{

background:
linear-gradient(
90deg,
#007aff,
#7c3aed,
#ff2d55
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;
}

.subtitle{

max-width:700px;

margin:auto;

font-size:26px;

line-height:1.6;

color:#6e6e73;
}

.hero-image{

width:100%;

max-width:1200px;

margin-top:80px;

border-radius:40px;

box-shadow:
0 30px 80px rgba(0,0,0,.08);

display:block;

margin-left:auto;

margin-right:auto;
}

/* ================= SECTION ================= */

.section{

max-width:1400px;

margin:auto;

padding:
140px
30px;
}

.section-title{

font-size:56px;

font-weight:700;

text-align:center;

letter-spacing:-2px;

margin-bottom:20px;
}

.section-desc{

font-size:22px;

color:#6e6e73;

text-align:center;

margin-bottom:70px;
}

/* ================= STATS ================= */

.stats{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(250px,1fr)
);

gap:40px;
}

.stat{

text-align:center;
}

.stat-number{

font-size:72px;

font-weight:700;

letter-spacing:-3px;
}

.stat-label{

font-size:20px;

color:#6e6e73;
}

/* ================= CAROUSEL ================= */

.carousel-section{
max-width:1400px;
margin:0 auto;
padding:0 20px;
}

.carousel-wrapper{
position:relative;
width:100%;
overflow:hidden;
border-radius:42px;
background:white;
box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.carousel{
display:flex;
transition:transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.showcase-card{
flex:0 0 100%;
height:680px;
background:white;
border-radius:42px;
overflow:hidden;
position:relative;
display:flex;
flex-direction:column;
}

.card-badge{
position:absolute;
top:28px;
left:28px;
background:linear-gradient(135deg, #ff9500, #ff6b00);
color:white;
padding:10px 20px;
font-size:14px;
font-weight:600;
border-radius:999px;
z-index:10;
box-shadow:0 4px 15px rgba(255,149,0,0.3);
}

.card-content{
flex:1;
display:flex;
padding:80px 80px 0;
gap:60px;
}

.card-info{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
}

.card-info h2{
font-size:56px;
font-weight:700;
letter-spacing:-2px;
margin-bottom:16px;
line-height:1.1;
}

.card-info p{
font-size:19px;
color:#6e6e73;
line-height:1.6;
margin-bottom:20px;
}

.card-info .card-description{
font-size:15px;
color:#86868b;
line-height:1.7;
margin-top:auto;
padding-top:30px;
}

.card-image{
flex:1.2;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card-image img{
max-height:500px;
max-width:100%;
object-fit:contain;
transition:transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
filter:drop-shadow(0 25px 50px rgba(0,0,0,0.12));
}

.showcase-card:hover .card-image img{
transform:scale(1.03) translateY(-5px);
}

/* Carousel Navigation */
.carousel-nav{
position:absolute;
top:50%;
transform:translateY(-50%);
width:56px;
height:56px;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:none;
border-radius:50%;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
z-index:20;
box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

.carousel-nav:hover{
background:white;
transform:translateY(-50%) scale(1.1);
box-shadow:0 8px 35px rgba(0,0,0,0.18);
}

.carousel-nav.prev{left:24px;}
.carousel-nav.next{right:24px;}

.carousel-nav svg{
width:24px;
height:24px;
fill:none;
stroke:#1d1d1f;
stroke-width:2.5;
stroke-linecap:round;
stroke-linejoin:round;
}

/* Carousel Indicators */
.carousel-indicators{
display:flex;
justify-content:center;
gap:14px;
margin-top:35px;
padding-bottom:20px;
}

.carousel-indicator{
width:12px;
height:12px;
border-radius:50%;
background:#d1d1d6;
cursor:pointer;
transition:all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
border:none;
padding:0;
}

.carousel-indicator:hover{
background:#86868b;
transform:scale(1.2);
}

.carousel-indicator.active{
background:#007aff;
transform:scale(1.4);
box-shadow:0 3px 12px rgba(0,122,255,0.4);
}

/* Progress Bar */
.carousel-progress{
position:absolute;
bottom:0;
left:0;
right:0;
height:5px;
background:rgba(0,0,0,0.04);
}

.carousel-progress-bar{
height:100%;
background:linear-gradient(90deg, #007aff, #5856d6, #af52de);
transition:width 0.1s linear;
}

/* Autoplay Controls */
.autoplay-controls{
position:absolute;
bottom:24px;
right:24px;
display:flex;
gap:12px;
z-index:20;
}

.autoplay-btn{
width:44px;
height:44px;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:none;
border-radius:50%;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:all 0.3s ease;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.autoplay-btn:hover{
background:white;
transform:scale(1.1);
box-shadow:0 6px 25px rgba(0,0,0,0.15);
}

.autoplay-btn svg{
width:18px;
height:18px;
fill:#1d1d1f;
}

.autoplay-btn.playing{
background:#007aff;
}

.autoplay-btn.playing svg{
fill:white;
}

/* ================= TIMELINE ================= */

.timeline{

max-width:900px;

margin:auto;
}

.timeline-item{

background:white;

padding:40px;

border-radius:24px;

margin-bottom:30px;

box-shadow:
0 15px 40px rgba(0,0,0,.05);
}

.timeline-date{

font-size:15px;

font-weight:600;

color:#007aff;

margin-bottom:12px;
}

.timeline-item h3{

font-size:28px;

margin-bottom:10px;
}

.timeline-item p{

font-size:18px;

line-height:1.8;

color:#555;
}

/* ================= FOOTER ================= */

footer{

padding:100px 20px;

text-align:center;

color:#86868b;
}

/* ================= MOBILE RESPONSIVE ================= */

@media(max-width:1024px){
.showcase-card{
height:600px;
}

.card-content{
padding:60px 50px 0;
gap:40px;
}

.card-info h2{
font-size:44px;
}

.card-info p{
font-size:17px;
}

.card-image img{
max-height:420px;
}
}

@media(max-width:768px){
.hero h1{
font-size:52px;
}

.subtitle{
font-size:20px;
}

.section-title{
font-size:34px;
}

.showcase-card{
height:auto;
min-height:580px;
border-radius:28px;
}

.card-content{
flex-direction:column;
padding:70px 28px 30px;
gap:20px;
}

.card-info h2{
font-size:32px;
margin-bottom:12px;
}

.card-info p{
font-size:16px;
}

.card-info .card-description{
font-size:14px;
padding-top:20px;
}

.card-image{
flex:1;
padding:10px 20px 20px;
}

.card-image img{
max-height:280px;
}

.carousel-nav{
width:44px;
height:44px;
}

.carousel-nav.prev{left:12px;}
.carousel-nav.next{right:12px;}

.carousel-nav svg{
width:20px;
height:20px;
}

.carousel-indicators{
margin-top:25px;
}

.autoplay-controls{
bottom:16px;
right:16px;
}

.autoplay-btn{
width:38px;
height:38px;
}
}
</style>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
// Carousel functionality
let currentSlide = 0;
let totalSlides = 0;
let autoplayInterval = null;
let isPlaying = false;
const AUTOPLAY_DELAY = 5000;

function updateCarousel() {
const carousel = document.getElementById('carousel');
if (!carousel) return;

carousel.style.transform = `translateX(-${currentSlide * 100}%)`;

// Update indicators
const indicators = document.querySelectorAll('.carousel-indicator');
indicators.forEach((indicator, index) => {
indicator.classList.toggle('active', index === currentSlide);
});

// Update progress bar
const progressBar = document.getElementById('progressBar');
if (progressBar && totalSlides > 0) {
const progress = ((currentSlide + 1) / totalSlides) * 100;
progressBar.style.width = `${progress}%`;
}
}

function moveCarousel(direction) {
currentSlide += direction;
if (currentSlide < 0) currentSlide = totalSlides - 1;
if (currentSlide >= totalSlides) currentSlide = 0;
updateCarousel();
resetAutoplay();
}

function goToSlide(index) {
currentSlide = index;
updateCarousel();
resetAutoplay();
}

function toggleAutoplay() {
const btn = document.getElementById('autoplayBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');

if (isPlaying) {
stopAutoplay();
} else {
startAutoplay();
}
}

function startAutoplay() {
if (autoplayInterval) clearInterval(autoplayInterval);
isPlaying = true;

const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const btn = document.getElementById('autoplayBtn');

if (playIcon) playIcon.style.display = 'none';
if (pauseIcon) pauseIcon.style.display = 'block';
if (btn) btn.classList.add('playing');

autoplayInterval = setInterval(() => {
moveCarousel(1);
}, AUTOPLAY_DELAY);
}

function stopAutoplay() {
if (autoplayInterval) {
clearInterval(autoplayInterval);
autoplayInterval = null;
}
isPlaying = false;

const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const btn = document.getElementById('autoplayBtn');

if (playIcon) playIcon.style.display = 'block';
if (pauseIcon) pauseIcon.style.display = 'none';
if (btn) btn.classList.remove('playing');
}

function resetAutoplay() {
if (isPlaying) {
stopAutoplay();
startAutoplay();
}
}

// Touch support for mobile
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('DOMContentLoaded', () => {
const carouselWrapper = document.querySelector('.carousel-wrapper');
if (carouselWrapper) {
carouselWrapper.addEventListener('touchstart', (e) => {
touchStartX = e.changedTouches[0].screenX;
}, {passive: true});

carouselWrapper.addEventListener('touchend', (e) => {
touchEndX = e.changedTouches[0].screenX;
handleSwipe();
}, {passive: true});
}
});

function handleSwipe() {
const swipeThreshold = 50;
const diff = touchStartX - touchEndX;

if (Math.abs(diff) > swipeThreshold) {
if (diff > 0) {
moveCarousel(1);
} else {
moveCarousel(-1);
}
}
}

// Initialize autoplay when photos are loaded
window.addEventListener('load', () => {
setTimeout(() => {
if (totalSlides > 1) {
startAutoplay();
}
}, 1000);
});
</script>
