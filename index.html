<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DUNDUN DIGITAL MUSEUM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

--bg:#080b14;
--surface:#131a2a;
--surface2:#1a2338;

--text:#ffffff;
--sub:#9ca3af;

--accent:#60a5fa;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Inter',sans-serif;

background:
linear-gradient(
180deg,
#080b14 0%,
#0f172a 50%,
#111827 100%
);

color:white;

overflow-x:hidden;
}

/* ---------------- HERO ---------------- */

.hero{

height:100vh;

display:flex;

justify-content:center;
align-items:center;

flex-direction:column;

position:relative;

text-align:center;

padding:20px;
}

.hero::before{

content:'';

position:absolute;

width:700px;
height:700px;

background:#2563eb;

filter:blur(250px);

opacity:.18;

border-radius:50%;
}

.hero::after{

content:'';

position:absolute;

width:400px;
height:400px;

background:#06b6d4;

filter:blur(200px);

opacity:.12;

border-radius:50%;

top:15%;
right:15%;
}

.hero h1{

font-size:
clamp(
4rem,
12vw,
9rem
);

font-weight:800;

letter-spacing:-5px;

position:relative;

z-index:2;
}

.hero p{

margin-top:20px;

font-size:1.2rem;

color:var(--sub);

position:relative;

z-index:2;
}

.scroll{

margin-top:50px;

font-size:.9rem;

letter-spacing:3px;

color:#64748b;

position:relative;

z-index:2;
}

/* ---------------- CONTAINER ---------------- */

.container{

max-width:1400px;

margin:auto;

padding:80px 30px;
}

.section-title{

font-size:2.3rem;

font-weight:700;

margin-bottom:40px;
}

/* ---------------- STATS ---------------- */

.stats{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(250px,1fr)
);

gap:25px;

margin-bottom:120px;
}

.stat-card{

background:
rgba(
255,
255,
255,
0.05
);

border:
1px solid
rgba(
255,
255,
255,
0.08
);

backdrop-filter:
blur(20px);

border-radius:24px;

padding:40px;
}

.stat-number{

font-size:3rem;

font-weight:800;
}

.stat-label{

margin-top:10px;

color:var(--sub);
}

/* ---------------- GALLERY ---------------- */

.gallery{

column-count:3;

column-gap:25px;
}

.card{

background:
rgba(
255,
255,
255,
0.05
);

border:
1px solid
rgba(
255,
255,
255,
0.08
);

border-radius:24px;

overflow:hidden;

margin-bottom:25px;

break-inside:avoid;

backdrop-filter:
blur(20px);

transition:
all .35s ease;
}

.card:hover{

transform:
translateY(-8px);

box-shadow:
0 20px 40px
rgba(
0,
0,
0,
0.3
);
}

.card img{

width:100%;

display:block;
}

.card-content{

padding:20px;
}

.card-content h3{

font-size:1rem;

font-weight:600;
}

/* ---------------- TIMELINE ---------------- */

.timeline{

max-width:900px;
}

.timeline-item{

background:
rgba(
255,
255,
255,
0.05
);

border:
1px solid
rgba(
255,
255,
255,
0.08
);

border-radius:24px;

padding:30px;

margin-bottom:25px;

backdrop-filter:
blur(20px);

transition:.3s;
}

.timeline-item:hover{

transform:
translateX(5px);
}

.timeline-date{

color:#60a5fa;

font-size:.9rem;

margin-bottom:10px;

font-weight:600;
}

.timeline-item h3{

margin-bottom:10px;
}

.timeline-item p{

color:#d1d5db;
}

/* ---------------- FOOTER ---------------- */

footer{

padding:120px 20px;

text-align:center;

color:#64748b;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){

.gallery{

column-count:2;
}

}

@media(max-width:600px){

.gallery{

column-count:1;
}

.hero h1{

font-size:4rem;
}

.container{

padding:50px 20px;
}

}

</style>

</head>

<body>

<section class="hero">

<h1>DUNDUN</h1>

<p>
A Living Digital Museum
</p>

<div class="scroll">

SCROLL ↓

</div>

</section>

<div class="container">

<section>

<h2 class="section-title">
Archive Statistics
</h2>

<div class="stats">

<div class="stat-card">

<div
id="photoCount"
class="stat-number">

0

</div>

<div class="stat-label">

Photos

</div>

</div>

<div class="stat-card">

<div
id="timelineCount"
class="stat-number">

0

</div>

<div class="stat-label">

Events

</div>

</div>

<div class="stat-card">

<div class="stat-number">

2026

</div>

<div class="stat-label">

Museum Established

</div>

</div>

</div>

</section>

<section>

<h2 class="section-title">

Photo Archive

</h2>

<div
id="gallery"
class="gallery">
</div>

</section>

<br><br><br>

<section>

<h2 class="section-title">

Life Timeline

</h2>

<div
id="timeline"
class="timeline">
</div>

</section>

</div>

<footer>

DUNDUN DIGITAL MUSEUM

</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
